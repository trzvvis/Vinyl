<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애플뮤직 실시간 바이닐 사운드 플레이어</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            red: '#fa243c',
                            pink: '#ff375f',
                            darkbg: '#08080a',
                            card: '#121216'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #08080a;
            color: #f4f4f5;
        }

        @keyframes spin-vinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .vinyl-spinning {
            animation: spin-vinyl 1.8s linear infinite;
        }

        .vinyl-paused {
            animation-play-state: paused;
        }

        /* 톤암 회전 애니메이션 */
        .tonearm {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 28px 28px;
        }
        .tonearm-playing {
            transform: rotate(26deg);
        }
        .tonearm-paused {
            transform: rotate(0deg);
        }

        /* 바이닐 홈 텍스처 */
        .vinyl-grooves {
            background: radial-gradient(circle at center, 
                #111 0%, #111 22%, 
                #1e1e1e 22.5%, #151515 25%, #0a0a0a 28%,
                #222 28.5%, #141414 33%, #1c1c1c 37%,
                #111 37.5%, #0d0d0d 45%, #252525 45.5%,
                #111 50%, #1a1a1a 60%, #0d0d0d 68%,
                #222 68.5%, #111 75%, #181818 85%, #050505 100%);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.9), inset 0 0 15px rgba(255,255,255,0.08);
        }

        /* 비닐 반사광 효과 */
        .vinyl-sheen {
            background: conic-gradient(
                from 0deg at 50% 50%,
                rgba(255,255,255,0.02) 0deg,
                rgba(255,255,255,0.15) 45deg,
                rgba(255,255,255,0.02) 90deg,
                rgba(255,255,255,0.15) 225deg,
                rgba(255,255,255,0.02) 315deg
            );
        }

        /* 글래스모피즘 패널 */
        .glass-panel {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 이퀄라이저 바 애니메이션 */
        @keyframes sound-wave {
            0%, 100% { height: 4px; }
            50% { height: 26px; }
        }
        .bar-animate {
            animation: sound-wave 1.2s ease-in-out infinite;
        }
        .bar-paused {
            animation-play-state: paused;
            height: 4px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-apple-red selection:text-white">

    <header class="w-full py-5 px-6 border-b border-white/5 backdrop-blur-xl bg-black/40 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-apple-red via-red-500 to-pink-500 flex items-center justify-center shadow-lg shadow-apple-red/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">Apple Music Real Vinyl Studio</h1>
                    <p class="text-xs text-zinc-400 font-medium">실시간 애플뮤직 및 MP3 바이닐 턴테이블</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-apple-red opacity-75 hidden"></span>
                  <span id="statusDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-zinc-500"></span>
                </span>
                <span id="statusText" class="text-xs text-zinc-400 font-medium">정지됨</span>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8 flex flex-col items-center justify-center space-y-6">
        
        <!-- 검색 및 오디오 입력 컨트롤 패널 -->
        <div class="w-full max-w-xl glass-panel rounded-3xl p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-xs font-bold uppercase tracking-widest text-zinc-400">애플뮤직 링크 / 곡 제목 검색</h2>
                <span class="text-[11px] bg-apple-red/20 text-apple-pink px-2.5 py-0.5 rounded-full font-semibold">Real Audio</span>
            </div>
            
            <div class="space-y-3">
                <!-- 입력 박스 및 검색 버튼 -->
                <div class="flex gap-2">
                    <input type="text" id="trackInput" placeholder="애플뮤직 링크나 곡명 (예: NewJeans Hype Boy, IU, ColdPlay)..." class="flex-grow bg-black/50 border border-white/10 rounded-2xl px-4 py-3 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-apple-red transition-all shadow-inner">
                    <button id="searchBtn" class="bg-gradient-to-r from-apple-red to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-medium px-5 py-3 rounded-2xl text-sm transition-all shadow-lg shadow-apple-red/25 flex items-center justify-center shrink-0 space-x-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <span>가져오기</span>
                    </button>
                </div>

                <!-- 직접 파일 업로드 및 샘플 칩 -->
                <div class="flex flex-wrap items-center justify-between text-xs gap-2 pt-1 border-t border-white/5">
                    <label class="cursor-pointer text-zinc-400 hover:text-white transition-colors flex items-center space-x-1 py-1">
                        <svg class="w-4 h-4 text-apple-pink" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        <span>내 MP3 파일 업로드</span>
                        <input type="file" id="localFileInput" accept="audio/*" class="hidden">
                    </label>
                    <span class="text-zinc-600">또는 샘플 선택:</span>
                </div>

                <!-- 빠른 샘플 곡들 -->
                <div id="presetsContainer" class="grid grid-cols-3 gap-2 pt-1">
                    <!-- JS 동적 생성 -->
                </div>
            </div>
        </div>

        <div class="relative w-full max-w-xl glass-panel rounded-[2.5rem] p-8 sm:p-10 shadow-2xl overflow-hidden flex flex-col items-center justify-center border border-white/10 bg-gradient-to-b from-zinc-900/90 via-zinc-950/95 to-black">
            
            <!-- 배경 패턴 -->
            <div class="absolute inset-0 bg-[radial-gradient(#27272a_1px,transparent_1px)] [background-size:20px_20px] opacity-10 pointer-events-none"></div>

            <!-- 현재 곡 정보 & 오디오 주파수 이퀄라이저 시각화 -->
            <div class="w-full flex items-center justify-between mb-8 z-10 px-2">
                <div class="max-w-[70%]">
                    <h3 id="trackTitleDisplay" class="text-xl font-extrabold text-white tracking-tight drop-shadow-md truncate">Blinding Lights</h3>
                    <p id="artistDisplay" class="text-xs text-zinc-400 font-medium mt-1 truncate">The Weeknd &bull; After Hours</p>
                </div>
                
                <!-- 오디오 파형 바 -->
                <div id="audioVisualizer" class="flex items-end space-x-1 h-8 opacity-40 transition-opacity">
                    <div class="w-1 bg-apple-red rounded-full bar-animate bar-paused" style="animation-delay: 0.1s;"></div>
                    <div class="w-1 bg-apple-red rounded-full bar-animate bar-paused" style="animation-delay: 0.4s;"></div>
                    <div class="w-1 bg-apple-red rounded-full bar-animate bar-paused" style="animation-delay: 0.2s;"></div>
                    <div class="w-1 bg-apple-red rounded-full bar-animate bar-paused" style="animation-delay: 0.6s;"></div>
                    <div class="w-1 bg-apple-red rounded-full bar-animate bar-paused" style="animation-delay: 0.3s;"></div>
                </div>
            </div>

            <!-- 턴테이블 메인 스테이지 -->
            <div class="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center z-10">
                
                <!-- 바이닐 레코드 (Vinyl Record) -->
                <div id="vinylRecord" class="w-full h-full rounded-full vinyl-grooves shadow-2xl relative flex items-center justify-center cursor-pointer vinyl-spinning vinyl-paused transition-transform hover:scale-[1.01]">
                    <!-- 하이라이트 광택 오버레이 -->
                    <div class="absolute inset-0 rounded-full vinyl-sheen pointer-events-none"></div>

                    <!-- 바이닐 중앙 라벨 (앨범 아트워크) -->
                    <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full overflow-hidden border-[6px] border-zinc-900 shadow-2xl relative flex items-center justify-center bg-zinc-950">
                        <img id="vinylLabelImg" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80" alt="Album Cover" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400/222222/ffffff?text=Album'">
                        
                        <!-- 레코드 중앙 센터 스핀 홀 -->
                        <div class="absolute w-4 h-4 bg-zinc-950 rounded-full border-2 border-zinc-700 shadow-inner"></div>
                    </div>
                </div>

                <!-- 톤암 (Tone Arm) 그래픽 -->
                <div id="tonearmElement" class="absolute top-1 right-1 w-32 sm:w-36 h-48 sm:h-52 pointer-events-none tonearm tonearm-paused origin-top-right z-20 drop-shadow-2xl">
                    <!-- 피벗 베이스 -->
                    <div class="absolute top-0 right-0 w-12 h-12 rounded-full bg-gradient-to-br from-zinc-200 via-zinc-400 to-zinc-600 shadow-xl border border-zinc-300 flex items-center justify-center">
                        <div class="w-5 h-5 rounded-full bg-zinc-900 shadow-inner"></div>
                    </div>
                    <!-- 암 스틱 (메탈 그라데이션) -->
                    <div class="absolute top-6 right-5 w-2.5 h-38 bg-gradient-to-r from-zinc-300 via-white to-zinc-400 rounded-full shadow-lg transform -rotate-12 origin-top"></div>
                    <!-- 카트리지 및 스타일러스 헤드 -->
                    <div class="absolute bottom-3 right-10 w-5 h-7 bg-zinc-900 rounded-md border border-zinc-600 transform rotate-12 shadow-md flex items-center justify-center">
                        <div class="w-1.5 h-1.5 bg-apple-red rounded-full animate-pulse"></div>
                    </div>
                </div>
            </div>

            <!-- 재생 슬라이더 및 시계 -->
            <div class="w-full mt-6 space-y-1.5 z-10 px-2">
                <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-apple-red">
                <div class="flex justify-between text-[11px] text-zinc-500 font-mono">
                    <span id="currentTimeDisplay">0:00</span>
                    <span id="durationDisplay">0:30</span>
                </div>
            </div>

            <!-- 재생 제어 컨트롤 버튼 -->
            <div class="mt-4 flex items-center space-x-4 z-10">
                <button id="playPauseBtn" class="bg-gradient-to-r from-apple-red via-red-500 to-pink-600 hover:from-red-600 hover:to-pink-700 text-white font-semibold px-10 py-3.5 rounded-2xl shadow-xl shadow-apple-red/30 flex items-center space-x-2.5 transition-all transform active:scale-95 group">
                    <svg id="playIcon" class="w-5 h-5 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="pauseIcon" class="w-5 h-5 hidden transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                    <span id="playBtnText" class="tracking-wide text-sm">재생 (Play)</span>
                </button>
            </div>
        </div>
    </main>

    <!-- 숨겨진 오디오 태그 -->
    <audio id="audioPlayer" crossorigin="anonymous" class="hidden"></audio>

    <footer class="w-full py-5 text-center text-xs text-zinc-500 border-t border-white/5 bg-black/40">
        <p>Apple Music Real Vinyl Experience &bull; Powered by iTunes Audio API</p>
    </footer>

    <script>
        // 샘플 트랙 데이터베이스
        const sampleTracks = [
            {
                title: "Hype Boy",
                artist: "NewJeans",
                cover: "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/31/36/ef/3136efc9-e770-449e-b1e1-e1248a30efdf/196922067756_Cover.jpg/600x600bb.jpg",
                previewUrl: "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview116/v4/4a/12/38/4a1238eb-6238-a28a-c215-6d60c49bc82e/mzaf_16480838171732688466.plus.aac.p.m4a"
            },
            {
                title: "Blinding Lights",
                artist: "The Weeknd",
                cover: "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/80/4c/76/804c7608-f463-549b-7e6e-d9e030e263c9/20UMGIM08287.rgb.jpg/600x600bb.jpg",
                previewUrl: "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/bd/1e/8a/bd1e8a93-ef72-10e5-779d-d3eb7494f6c0/mzaf_10331070857343272911.plus.aac.p.m4a"
            },
            {
                title: "Viva La Vida",
                artist: "Coldplay",
                cover: "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/3d/bf/98/3dbf98d4-eb3d-3652-3a52-d98cbe638209/00094631229053.rgb.jpg/600x600bb.jpg",
                previewUrl: "https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview115/v4/6b/e6/bd/6be6bd31-64b5-fa53-0604-ee2010c710d0/mzaf_14959419149791408013.plus.aac.p.m4a"
            }
        ];

        // 엘리먼트 참조
        const audioPlayer = document.getElementById('audioPlayer');
        const vinylRecord = document.getElementById('vinylRecord');
        const tonearmElement = document.getElementById('tonearmElement');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const playBtnText = document.getElementById('playBtnText');
        const statusDot = document.getElementById('statusDot');
        const statusPing = document.getElementById('statusPing');
        const statusText = document.getElementById('statusText');
        
        const trackTitleDisplay = document.getElementById('trackTitleDisplay');
        const artistDisplay = document.getElementById('artistDisplay');
        const vinylLabelImg = document.getElementById('vinylLabelImg');
        const progressBar = document.getElementById('progressBar');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');
        const durationDisplay = document.getElementById('durationDisplay');
        
        const trackInput = document.getElementById('trackInput');
        const searchBtn = document.getElementById('searchBtn');
        const localFileInput = document.getElementById('localFileInput');
        const presetsContainer = document.getElementById('presetsContainer');
        const visualizerBars = document.querySelectorAll('.bar-animate');

        let isPlaying = false;

        // 샘플 트랙 버튼 생성
        sampleTracks.forEach((track) => {
            const btn = document.createElement('button');
            btn.className = "text-xs text-left p-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-zinc-300 transition-all border border-white/5 flex flex-col justify-center truncate";
            btn.innerHTML = `<span class="font-semibold text-white truncate">${track.title}</span><span class="text-[10px] text-zinc-400 truncate">${track.artist}</span>`;
            btn.onclick = () => loadAndPlayTrack(track.title, track.artist, track.cover, track.previewUrl);
            presetsContainer.appendChild(btn);
        });

        // 곡 로드 및 재생 함수
        function loadAndPlayTrack(title, artist, cover, audioSrc) {
            trackTitleDisplay.textContent = title;
            artistDisplay.textContent = `${artist} • Apple Music`;
            vinylLabelImg.src = cover;
            
            if (audioSrc) {
                audioPlayer.src = audioSrc;
                audioPlayer.load();
                playAudio();
            }
        }

        // 재생 동작
        function playAudio() {
            audioPlayer.play().then(() => {
                isPlaying = true;
                updateUIState();
            }).catch(e => {
                console.log("Audio play error:", e);
            });
        }

        // 일시정지 동작
        function pauseAudio() {
            audioPlayer.pause();
            isPlaying = false;
            updateUIState();
        }

        // 토글 재생
        function togglePlay() {
            if (isPlaying) {
                pauseAudio();
            } else {
                if (!audioPlayer.src) {
                    // 기본 트랙 로드
                    const defaultTrack = sampleTracks[0];
                    loadAndPlayTrack(defaultTrack.title, defaultTrack.artist, defaultTrack.cover, defaultTrack.previewUrl);
                } else {
                    playAudio();
                }
            }
        }

        // UI 상태 업데이트
        function updateUIState() {
            if (isPlaying) {
                vinylRecord.classList.remove('vinyl-paused');
                tonearmElement.classList.remove('tonearm-paused');
                tonearmElement.classList.add('tonearm-playing');
                
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
                playBtnText.textContent = "일시정지 (Pause)";
                
                statusDot.classList.remove('bg-zinc-500');
                statusDot.classList.add('bg-emerald-500');
                statusPing.classList.remove('hidden');
                statusText.textContent = "재생 중";
                statusText.classList.add('text-emerald-400');

                visualizerBars.forEach(bar => bar.classList.remove('bar-paused'));
            } else {
                vinylRecord.classList.add('vinyl-paused');
                tonearmElement.classList.remove('tonearm-playing');
                tonearmElement.classList.add('tonearm-paused');
                
                pauseIcon.classList.add('hidden');
                playIcon.classList.remove('hidden');
                playBtnText.textContent = "재생 (Play)";
                
                statusDot.classList.remove('bg-emerald-500');
                statusDot.classList.add('bg-zinc-500');
                statusPing.classList.add('hidden');
                statusText.textContent = "정지됨";
                statusText.classList.remove('text-emerald-400');

                visualizerBars.forEach(bar => bar.classList.add('bar-paused'));
            }
        }

        // iTunes API 검색 함수 (링크 또는 검색어 대응)
        async function fetchTrackFromiTunes(query) {
            let searchTerm = query;
            
            // 만약 URL 형태로 들어왔을 때 유연하게 처리
            if (query.includes('music.apple.com')) {
                const parts = query.split('/');
                const songName = parts[parts.length - 2] || parts[parts.length - 1];
                searchTerm = songName.replace(/-/g, ' ');
            }

            statusText.textContent = "검색 중...";
            try {
                const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchTerm)}&entity=song&limit=1`);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    const track = data.results[0];
                    // 고해상도 앨범아트 주소 변경
                    const highResArt = track.artworkUrl100.replace('100x100bb', '600x600bb');
                    loadAndPlayTrack(track.trackName, track.artistName, highResArt, track.previewUrl);
                } else {
                    alert("해당 검색어 또는 링크의 음악을 찾을 수 없습니다.");
                    statusText.textContent = "정지됨";
                }
            } catch (err) {
                console.error("iTunes Search API Error:", err);
                alert("음악 정보를 불러오는 중 오류가 발생했습니다.");
                statusText.textContent = "정지됨";
            }
        }

        // 검색 버튼 클릭 이벤트
        searchBtn.onclick = () => {
            const val = trackInput.value.trim();
            if (val) {
                fetchTrackFromiTunes(val);
            }
        };

        // 엔터키 지원
        trackInput.onkeyup = (e) => {
            if (e.key === 'Enter') {
                searchBtn.click();
            }
        };

        // 로컬 MP3 파일 선택 처리
        localFileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const objectUrl = URL.createObjectURL(file);
                const title = file.name.replace(/\.[^/.]+$/, "");
                loadAndPlayTrack(title, "Local Track", "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=500&q=80", objectUrl);
            }
        };

        // 오디오 타임 업데이트 및 프로그레스 바 연동
        audioPlayer.ontimeupdate = () => {
            if (audioPlayer.duration) {
                const current = audioPlayer.currentTime;
                const duration = audioPlayer.duration;
                progressBar.value = (current / duration) * 100;

                const curMin = Math.floor(current / 60);
                const curSec = Math.floor(current % 60);
                currentTimeDisplay.textContent = `${curMin}:${curSec < 10 ? '0' : ''}${curSec}`;

                const durMin = Math.floor(duration / 60);
                const durSec = Math.floor(duration % 60);
                durationDisplay.textContent = `${durMin}:${durSec < 10 ? '0' : ''}${durSec}`;
            }
        };

        // 프로그레스 바 드래그 시 재생 위치 이동
        progressBar.oninput = (e) => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (e.target.value / 100) * audioPlayer.duration;
            }
        };

        // 곡 종료 시 정지 처리
        audioPlayer.onended = () => {
            pauseAudio();
            progressBar.value = 0;
        };

        // 재생/일시정지 이벤트 바인딩
        playPauseBtn.onclick = togglePlay;
        vinylRecord.onclick = togglePlay;

        // 초기 기본 곡 자동 설정 (NewJeans - Hype Boy)
        const initTrack = sampleTracks[0];
        trackTitleDisplay.textContent = initTrack.title;
        artistDisplay.textContent = `${initTrack.artist} • Apple Music`;
        vinylLabelImg.src = initTrack.cover;
        audioPlayer.src = initTrack.previewUrl;
    </script>
</body>
</html>
